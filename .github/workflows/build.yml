name: build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    # Makefile の IMAGE と同じタグに揃える（年度更新のときは両方を上げる）
    container: texlive/texlive:TL2025-historic
    strategy:
      fail-fast: false
      matrix:
        target: [main, thesis]
    steps:
      - uses: actions/checkout@v4

      - name: latexmk ${{ matrix.target }}.tex
        run: latexmk ${{ matrix.target }}.tex

      - name: 未定義の参照・引用が無いことを確かめる
        shell: bash
        run: |
          log=${{ matrix.target }}.log
          overfull=$(grep -c '^Overfull \\hbox' "$log" || true)
          echo "### ${{ matrix.target }}.tex" >> "$GITHUB_STEP_SUMMARY"
          echo "- Overfull \\hbox: ${overfull} 件" >> "$GITHUB_STEP_SUMMARY"
          if grep -nE "LaTeX Warning: (Reference|Citation) .* undefined|There were undefined references" "$log"; then
            echo "- 未定義の参照・引用あり（上のログを参照）" >> "$GITHUB_STEP_SUMMARY"
            echo "::error file=${{ matrix.target }}.tex::未定義の参照・引用があります"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.target }}-pdf
          path: ${{ matrix.target }}.pdf
          if-no-files-found: warn
